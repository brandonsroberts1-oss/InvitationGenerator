<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Wedding Invitation Generator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>Wedding Invitation</h1>
      <p class="sub">Laser-cut designs &middot; live preview &middot; mm-accurate SVG</p>
    </header>

    <section>
      <h2>Style</h2>
      <label>Template
        <select id="template">
          <option value="botanical">Botanical arch &mdash; floral border</option>
          <option value="arch">Arch die-cut &mdash; minimal</option>
          <option value="wave">Wavy edge &mdash; corner florals</option>
          <option value="gatefold">Gatefold lace doors</option>
        </select>
      </label>
      <label>Graphic
        <select id="motif"></select>
      </label>
      <label class="only-card">Text layout
        <select id="layout">
          <option value="classic">Classic — stacked script names</option>
          <option value="modern">Modern — left-aligned</option>
          <option value="editorial">Editorial — serif caps</option>
          <option value="crest">Monogram crest</option>
        </select>
      </label>
      <label class="only-gatefold">Door lace style
        <select id="doorStyle">
          <option value="crackle">Geometric crackle</option>
          <option value="floral">Floral vines</option>
          <option value="mandala">Mandala fan</option>
        </select>
      </label>
      <label class="check only-gatefold"><input id="showDoors" type="checkbox"> Lace fold-out doors</label>
      <label class="check only-gatefold"><input id="showHeart" type="checkbox"> Heart on right door</label>
      <button id="shuffle" type="button" class="ghost">&#x21bb; Shuffle pattern &amp; tree</button>
    </section>

    <section>
      <h2>Headline</h2>
      <label>Tagline
        <input id="tagline" type="text">
      </label>
      <div class="row only-gatefold">
        <label>Small word 1
          <input id="lineThe" type="text">
        </label>
        <label>Small word 2
          <input id="lineOf" type="text">
        </label>
      </div>
      <label class="only-gatefold">Title
        <input id="title" type="text">
      </label>
    </section>

    <section>
      <h2>Couple</h2>
      <div class="row">
        <label>First name
          <input id="name1" type="text">
        </label>
        <label>Second name
          <input id="name2" type="text">
        </label>
      </div>
    </section>

    <section>
      <h2>Date &amp; time</h2>
      <div class="row">
        <label>Day of week
          <input id="dayOfWeek" type="text">
        </label>
        <label>Time
          <input id="time" type="text">
        </label>
      </div>
      <div class="row three">
        <label>Month
          <input id="month" type="text">
        </label>
        <label>Day
          <input id="dayNum" type="text">
        </label>
        <label>Year
          <input id="year" type="text">
        </label>
      </div>
    </section>

    <section>
      <h2>Venue &amp; details</h2>
      <label>Venue
        <input id="venue" type="text">
      </label>
      <label>Address (one line per row)
        <textarea id="address" rows="2"></textarea>
      </label>
      <label>RSVP line
        <input id="rsvp" type="text">
      </label>
      <label>Footer line
        <input id="footer" type="text">
      </label>
    </section>

    <section>
      <h2>Export</h2>
      <button id="export-laser" type="button" class="primary">Download laser-ready SVG</button>
      <p class="hint">Text traced to outlines &middot; <span class="swatch red"></span> red = cut &middot; <span class="swatch black"></span> black = engrave &middot; real mm units</p>
      <button id="export-editable" type="button" class="ghost">Download SVG with editable text</button>
      <p id="export-status" class="hint status"></p>
    </section>
  </aside>

  <main id="stage">
    <div id="preview"></div>
  </main>

  <script src="vendor/opentype.min.js"></script>
  <script src="js/lattice.js"></script>
  <script src="js/template.js"></script>
  <script src="js/motifs.js"></script>
  <script src="js/doorstyles.js"></script>
  <script src="js/textpaths.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
